<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — TRACE Business Consultants</title>
<meta name="description" content="Tulisan dari tim TRACE Business Consultants tentang finance, operasional, dan pertumbuhan bisnis F&B.">
<link rel="icon" href="assets/img/tc-mark-ink.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"><link rel="stylesheet" href="assets/css/tokens.css"><link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="site-frame">

  <nav class="nav">
    <a href="index.html" class="nav-brand">
      <span class="nav-mark"><img src="assets/img/tc-mark-white.png" alt=""></span>
      <span class="nav-brand-name">TRACE Business Consultants</span>
    </a>
    <div class="nav-center">
      <div class="nav-chip-group"><span>Finance &amp; HPP</span><span>Business Diagnosis</span></div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <a href="index.html#kontak" class="nav-cta"><span class="dot">→</span> Booking Diagnosis</a>
    </div>
  </nav>

  <main class="wrap article" id="article">
    <a class="article-back" href="blog.html">← Kembali ke blog</a>
    <div class="empty-state">Memuat tulisan...</div>
  </main>

  <footer class="site-footer wrap">
    <span>© <span id="year"></span> TRACE Business Consultants.</span>
    <div class="footer-links">
      <a href="index.html#tentang-kami">Tentang</a>
      <a href="index.html#layanan">Layanan</a>
      <a href="index.html#kontak">Kontak</a>
    </div>
  </footer>
</div>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
(async function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const el = document.getElementById('article');
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) {
    el.innerHTML = '<a class="article-back" href="blog.html">← Kembali ke blog</a><div class="empty-state">Tulisan tidak ditemukan.</div>';
    return;
  }
  const { data: post, error } = await window.traceBlog.getPost(slug);
  if (error || !post) {
    el.innerHTML = '<a class="article-back" href="blog.html">← Kembali ke blog</a><div class="empty-state">Tulisan tidak ditemukan atau belum tayang.</div>';
    return;
  }
  document.title = post.title + ' — TRACE Business Consultants';
  const md = document.querySelector('meta[name="description"]');
  if (md && post.excerpt) md.setAttribute('content', post.excerpt);
  const fmt = new Date(post.published_at).toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  el.innerHTML = `
    <a class="article-back" href="blog.html">← Kembali ke blog</a>
    <span class="post-date">${fmt}</span>
    <h1>${esc(post.title)}</h1>
    ${post.cover_image_url ? `<img class="article-cover" src="${esc(post.cover_image_url)}" alt="">` : ''}
    <div class="article-body">${post.body_html || ''}</div>
  `;
})();
</script>
</body>
</html>
